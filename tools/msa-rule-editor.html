<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSA rule editor</title>
<style>
  :root{
    --paper:#EFF1ED;
    --card:#FFFFFF;
    --ink:#17211D;
    --muted:#5C6862;
    --faint:#8A9490;
    --line:#D7DCD6;
    --line-soft:#E7EAE5;
    --teal:#0F5C4D;
    --teal-dark:#0A463A;
    --blocker:#9E2B25;
    --flag:#B0740B;
    --info:#3D6280;
    --high:#2E7D5B;
    --medium:#B0740B;
    --low:#9E2B25;
    --focus:#0F5C4D;
    --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  textarea{resize:vertical}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    padding:14px 22px 12px;
    background:var(--card);
    border-bottom:1px solid var(--line);
  }
  .wordmark{
    font-family:var(--serif);
    font-size:19px;
    letter-spacing:-.01em;
    margin:0;
    font-weight:600;
  }
  .filename{
    color:var(--faint);
    font-size:12.5px;
    font-family:var(--mono);
    align-self:center;
  }
  .topbar .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    padding:6px 12px;
    border-radius:3px;
  }
  .btn:hover{border-color:var(--muted)}
  .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
  .rowitem:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.primary:hover{background:var(--teal-dark);border-color:var(--teal-dark)}
  .btn.quiet{border-color:transparent;color:var(--muted);padding:6px 8px}
  .btn.quiet:hover{color:var(--ink);border-color:var(--line)}
  .btn.danger{color:var(--blocker)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* ---------- document header ---------- */
  .docmeta{
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:0 22px 16px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:14px 24px;
  }
  .field label{
    display:block;
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:3px;
    letter-spacing:.01em;
  }
  .field input,.field select,.field textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:3px;
    padding:6px 8px;
  }
  .field input:hover,.field select:hover,.field textarea:hover{border-color:var(--muted)}

  /* ---------- coverage strip ---------- */
  .coverage{
    padding:12px 22px;
    background:var(--card);
    border-bottom:1px solid var(--line);
  }
  .bar{
    display:flex;height:8px;width:100%;
    background:var(--line-soft);
    border-radius:2px;overflow:hidden;
  }
  .bar span{display:block;height:100%}
  .legend{
    display:flex;gap:18px;flex-wrap:wrap;
    margin-top:9px;font-size:12.5px;color:var(--muted);
  }
  .legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .swatch{
    display:inline-block;width:8px;height:8px;border-radius:2px;
    margin-right:6px;vertical-align:baseline;
  }

  /* ---------- split ---------- */
  .split{
    display:grid;
    grid-template-columns:minmax(280px,360px) 1fr;
    align-items:start;
    gap:0;
  }
  .ledger{
    border-right:1px solid var(--line);
    background:var(--card);
    min-height:calc(100vh - 200px);
  }
  .filters{
    display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;
  }
  .filters input[type=search]{
    flex:1 1 130px;min-width:0;
    border:1px solid var(--line);border-radius:3px;padding:6px 8px;
  }
  .filters select{
    border:1px solid var(--line);border-radius:3px;padding:6px 6px;background:var(--card);
  }

  .groupname{
    padding:11px 12px 5px;
    font-size:12px;
    color:var(--muted);
    border-bottom:1px solid var(--line-soft);
  }
  .groupname b{color:var(--ink);font-variant-numeric:tabular-nums}

  .rowitem{
    display:block;width:100%;text-align:left;
    background:transparent;border:0;
    border-bottom:1px solid var(--line-soft);
    border-left:3px solid transparent;
    padding:9px 12px 9px 11px;
  }
  .rowitem:hover{background:#F6F8F5}
  .rowitem.selected{background:#EAF1EE;border-left-color:var(--teal)}
  .rowitem .rid{
    font-family:var(--mono);font-size:11.5px;color:var(--muted);
    display:flex;justify-content:space-between;gap:8px;align-items:center;
  }
  .rowitem .rstmt{
    margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;font-size:13.5px;
  }
  .sev{
    width:7px;height:7px;border-radius:50%;flex:none;
  }
  .sev.blocker{background:var(--blocker)}
  .sev.flag{background:var(--flag)}
  .sev.info{background:var(--info)}
  .conf{font-size:11px;letter-spacing:.02em}
  .conf.high{color:var(--high)}
  .conf.medium{color:var(--medium)}
  .conf.low{color:var(--low)}
  .issuedot{color:var(--blocker);font-weight:700}

  .addrule{padding:12px}

  /* ---------- editor ---------- */
  .editor{padding:20px 26px 60px;max-width:820px}
  .empty{
    padding:70px 26px;color:var(--muted);max-width:46ch;
    font-family:var(--serif);font-size:16px;line-height:1.6;
  }
  .quoteblock{
    border-left:3px solid var(--line);
    padding:2px 0 2px 16px;
    margin:0 0 22px;
  }
  .quoteblock textarea{
    width:100%;border:0;background:transparent;padding:0;
    font-family:var(--serif);font-size:17px;line-height:1.55;
    color:var(--ink);
  }
  .quoteblock textarea::placeholder{color:var(--faint);font-style:italic}
  .quotemeta{font-size:12px;color:var(--muted);margin-top:6px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}
  .stack{display:flex;flex-direction:column;gap:16px}

  .sectionrule{
    border:0;border-top:1px solid var(--line);
    margin:26px 0 18px;padding:0;
  }
  .sectionname{font-size:13px;color:var(--muted);margin:0 0 12px}

  .issues{
    border:1px solid var(--line);
    border-left:3px solid var(--flag);
    background:#FDFBF6;
    border-radius:3px;
    padding:11px 14px;
    margin-bottom:20px;
  }
  .issues ul{margin:6px 0 0;padding-left:18px}
  .issues li{margin:3px 0;font-size:13px}
  .issues .err{color:var(--blocker)}
  .issues h3{margin:0;font-size:13px;font-weight:600}

  .kv{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
  .kv input{border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%}

  .mono{font-family:var(--mono);font-size:13px}

  .editorhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}
  .editorhead .who{font-family:var(--mono);font-size:12.5px;color:var(--muted)}

  /* ---------- raw view ---------- */
  .raw{padding:20px 26px 60px}
  .raw textarea{
    width:100%;min-height:60vh;
    font-family:var(--mono);font-size:12.5px;line-height:1.55;
    border:1px solid var(--line);border-radius:3px;padding:12px;
    background:var(--card);
  }
  .rawnote{color:var(--muted);margin:0 0 10px;font-size:13px}

  .tabs{display:flex;gap:2px;padding:0 22px;background:var(--card);border-bottom:1px solid var(--line)}
  .tab{
    border:0;background:transparent;padding:9px 12px;color:var(--muted);
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--teal)}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:3px;
    font-size:13px;z-index:50;
  }
  .toast.err{background:var(--blocker)}

  .dropveil{
    position:fixed;inset:0;background:rgba(15,92,77,.10);
    border:3px dashed var(--teal);z-index:60;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:22px;color:var(--teal-dark);
  }

  @media (max-width:860px){
    .split{grid-template-columns:1fr}
    .ledger{border-right:0;border-bottom:1px solid var(--line);min-height:0}
    .grid2,.grid3{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <h1 class="wordmark">MSA rule editor</h1>
  <span class="filename" id="filename">no file open</span>
  <div class="actions">
    <button class="btn" id="btnOpen">Open YAML</button>
    <button class="btn" id="btnNew">Start empty set</button>
    <button class="btn quiet" id="btnExample">Load example</button>
    <button class="btn" id="btnCopy">Copy YAML</button>
    <button class="btn primary" id="btnSave">Save YAML</button>
    <input type="file" id="fileInput" accept=".yaml,.yml,.txt" hidden>
  </div>
</header>

<div class="docmeta" id="docmeta"></div>

<div class="coverage">
  <div class="bar" id="bar"></div>
  <div class="legend" id="legend"></div>
</div>

<nav class="tabs">
  <button class="tab active" data-view="rules">Rules</button>
  <button class="tab" data-view="raw">YAML</button>
</nav>

<main id="viewRules" class="split">
  <aside class="ledger">
    <div class="filters">
      <input type="search" id="q" placeholder="Search id, clause, statement">
      <select id="fSeverity"><option value="">Any severity</option></select>
      <select id="fConfidence"><option value="">Any confidence</option></select>
      <select id="fCheck"><option value="">Any check</option></select>
    </div>
    <div id="list"></div>
    <div class="addrule"><button class="btn" id="btnAdd">Add rule</button></div>
  </aside>
  <section id="editor" class="editor"></section>
</main>

<section id="viewRaw" class="raw" hidden>
  <p class="rawnote">Edit the YAML directly, then apply it to load your changes back into the editor. Applying replaces everything currently open.</p>
  <textarea id="rawText" spellcheck="false"></textarea>
  <p style="margin-top:10px">
    <button class="btn primary" id="btnApplyRaw">Apply YAML</button>
    <button class="btn quiet" id="btnRefreshRaw">Discard changes</button>
  </p>
</section>

<script>
"use strict";

/* =========================================================
   1. YAML subset parser and emitter
   Self contained so the tool works with no network access.
   Handles: nested maps, sequences of scalars, sequences of
   maps, quoted and plain scalars, block scalars, flow
   collections, comments.
   ========================================================= */

function yamlParse(text){
  const raw = text.replace(/\r\n?/g, "\n").split("\n");
  const lines = [];
  raw.forEach((ln, i) => {
    if (/^\s*$/.test(ln)) return;
    if (/^\s*#/.test(ln)) return;
    if (/^(---|\.\.\.)\s*$/.test(ln.trim())) return;
    const indent = ln.match(/^ */)[0].length;
    lines.push({ indent, text: ln.slice(indent), no: i + 1, rawLine: ln });
  });
  if (!lines.length) return {};
  let pos = 0;

  function stripComment(s){
    let out = "", q = null;
    for (let i = 0; i < s.length; i++){
      const c = s[i];
      if (q){
        out += c;
        if (c === q && s[i-1] !== "\\") q = null;
      } else if (c === '"' || c === "'"){
        q = c; out += c;
      } else if (c === "#" && (i === 0 || /\s/.test(s[i-1]))){
        break;
      } else out += c;
    }
    return out.trimEnd();
  }

  function scalar(s){
    s = s.trim();
    if (s === "") return "";
    if (s === "~" || s === "null" || s === "Null" || s === "NULL") return null;
    if (s === "true" || s === "True") return true;
    if (s === "false" || s === "False") return false;
    if (s[0] === '"' && s[s.length-1] === '"' && s.length > 1){
      return s.slice(1,-1)
        .replace(/\\n/g,"\n").replace(/\\t/g,"\t")
        .replace(/\\"/g,'"').replace(/\\\\/g,"\\");
    }
    if (s[0] === "'" && s[s.length-1] === "'" && s.length > 1){
      return s.slice(1,-1).replace(/''/g,"'");
    }
    if (s[0] === "[" ) return flowSeq(s);
    if (s[0] === "{" ) return flowMap(s);
    if (/^-?\d+$/.test(s)) return parseInt(s,10);
    if (/^-?\d*\.\d+$/.test(s)) return parseFloat(s);
    return s;
  }

  function splitFlow(inner){
    const parts = []; let depth = 0, q = null, cur = "";
    for (const c of inner){
      if (q){ cur += c; if (c === q) q = null; continue; }
      if (c === '"' || c === "'"){ q = c; cur += c; continue; }
      if (c === "[" || c === "{"){ depth++; cur += c; continue; }
      if (c === "]" || c === "}"){ depth--; cur += c; continue; }
      if (c === "," && depth === 0){ parts.push(cur); cur = ""; continue; }
      cur += c;
    }
    if (cur.trim() !== "") parts.push(cur);
    return parts;
  }
  function flowSeq(s){
    const inner = s.slice(1, s.lastIndexOf("]"));
    return splitFlow(inner).map(p => scalar(p));
  }
  function flowMap(s){
    const inner = s.slice(1, s.lastIndexOf("}"));
    const o = {};
    splitFlow(inner).forEach(p => {
      const i = p.indexOf(":");
      if (i === -1) return;
      o[scalar(p.slice(0,i))] = scalar(p.slice(i+1));
    });
    return o;
  }

  function blockScalar(marker, parentIndent){
    const fold = marker.trim()[0] === ">";
    const chomp = /-\s*$/.test(marker) ? "strip" : (/\+\s*$/.test(marker) ? "keep" : "clip");
    const buf = [];
    let base = null;
    while (pos < lines.length && lines[pos].indent > parentIndent){
      if (base === null) base = lines[pos].indent;
      buf.push(" ".repeat(Math.max(0, lines[pos].indent - base)) + lines[pos].text);
      pos++;
    }
    let out = fold ? buf.join(" ").replace(/\s+/g," ").trim() : buf.join("\n");
    if (chomp === "strip") out = out.replace(/\n+$/,"");
    return out;
  }

  function parseBlock(indent){
    if (pos >= lines.length) return null;
    if (lines[pos].text.startsWith("- ") || lines[pos].text === "-") return parseSeq(indent);
    return parseMap(indent);
  }

  function parseSeq(indent){
    const arr = [];
    while (pos < lines.length && lines[pos].indent === indent &&
           (lines[pos].text.startsWith("- ") || lines[pos].text === "-")){
      const line = lines[pos];
      const body = stripComment(line.text === "-" ? "" : line.text.slice(2)).trim();
      pos++;
      if (body === ""){
        const child = (pos < lines.length && lines[pos].indent > indent) ? parseBlock(lines[pos].indent) : null;
        arr.push(child);
        continue;
      }
      const m = body.match(/^([\w.\-\/ ]+?):(\s|$)/);
      if (m && body[0] !== '"' && body[0] !== "'" && body[0] !== "[" && body[0] !== "{"){
        // sequence item that is a map; re-inject the remainder as a map line
        const itemIndent = indent + 2;
        lines.splice(pos, 0, { indent: itemIndent, text: body, no: line.no });
        arr.push(parseMap(itemIndent));
      } else {
        arr.push(scalar(body));
      }
    }
    return arr;
  }

  function parseMap(indent){
    const obj = {};
    while (pos < lines.length && lines[pos].indent === indent){
      const line = lines[pos];
      if (line.text.startsWith("- ")) break;
      const clean = stripComment(line.text);
      const ci = keyColon(clean);
      if (ci === -1){
        throw new Error("Line " + line.no + ": expected \"key: value\" but found: " + line.text.slice(0,60));
      }
      const key = scalar(clean.slice(0, ci));
      const rest = clean.slice(ci + 1).trim();
      pos++;
      if (rest === ""){
        if (pos < lines.length && lines[pos].indent > indent){
          obj[key] = parseBlock(lines[pos].indent);
        } else obj[key] = null;
      } else if (rest[0] === "|" || rest[0] === ">"){
        obj[key] = blockScalar(rest, indent);
      } else {
        obj[key] = scalar(rest);
      }
    }
    return obj;
  }

  function keyColon(s){
    let q = null;
    for (let i = 0; i < s.length; i++){
      const c = s[i];
      if (q){ if (c === q) q = null; continue; }
      if (c === '"' || c === "'"){ q = c; continue; }
      if (c === ":" && (i === s.length - 1 || /\s/.test(s[i+1]))) return i;
    }
    return -1;
  }

  const result = parseBlock(lines[0].indent);
  return result === null ? {} : result;
}

function needsQuoting(s){
  if (s === "") return true;
  if (/^[\s]|[\s]$/.test(s)) return true;
  if (/^[-?:,\[\]{}#&*!|>'"%@`]/.test(s)) return true;
  if (/: |\s#/.test(s)) return true;
  if (/^(true|false|null|yes|no|on|off|~)$/i.test(s)) return true;
  if (/^-?\d+(\.\d+)?$/.test(s)) return true;
  return false;
}
function yq(s){
  s = String(s);
  if (s.includes("\n")) return null;
  if (!needsQuoting(s)) return s;
  return '"' + s.replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"';
}
function emitScalar(v, indent){
  if (v === null || v === undefined) return "";
  if (typeof v === "boolean" || typeof v === "number") return String(v);
  const s = String(v);
  if (s.includes("\n")){
    const pad = " ".repeat(indent + 2);
    return "|-\n" + s.split("\n").map(l => pad + l).join("\n");
  }
  return yq(s);
}
function emitList(key, arr, indent){
  const pad = " ".repeat(indent);
  if (!arr || !arr.length) return pad + key + ": []\n";
  return pad + key + ":\n" + arr.map(v => pad + "  - " + emitScalar(v, indent + 2)).join("\n") + "\n";
}
function emitMapField(key, obj, indent){
  const pad = " ".repeat(indent);
  const keys = Object.keys(obj || {});
  if (!keys.length) return "";
  return pad + key + ":\n" + keys.map(k =>
    pad + "  " + yq(k) + ": " + emitScalar(obj[k], indent + 2)
  ).join("\n") + "\n";
}

/* =========================================================
   2. Schema
   ========================================================= */

const ENUMS = {
  applies_to: ["line_item","budget_total","labour_total","phase"],
  check: ["deterministic","judgement"],
  precedence_layer: ["sow_specific","msa_amendment","msa","standard_card"],
  severity: ["blocker","flag","info"],
  confidence: ["high","medium","low"],
  tolerance_type: ["none","percent","absolute"]
};

const CATEGORIES = ["RATE","UPLIFT","MIX","MARKUP","NONBILL","EXPENSE","FEE","FX","APPROVAL","OTHER"];

function blankRule(){
  return {
    id:"", clause:"", quote:"", statement:"",
    applies_to:"line_item", scope:{}, check:"deterministic", logic:"",
    precedence_layer:"msa", requires_external:[],
    tolerance:{type:"none", value:0},
    severity:"flag", effective_from:"", effective_to:"",
    confidence:"low", reviewer_note:""
  };
}

function normaliseRule(r){
  const b = blankRule();
  const out = Object.assign(b, r || {});
  out.scope = (r && typeof r.scope === "object" && r.scope !== null) ? r.scope : {};
  if (Array.isArray(r && r.requires_external)) out.requires_external = r.requires_external.filter(x => x !== null && x !== "");
  else if (typeof (r && r.requires_external) === "string" && r.requires_external.trim()) out.requires_external = [r.requires_external.trim()];
  else out.requires_external = [];
  const t = (r && r.tolerance) || {};
  out.tolerance = { type: t.type || "none", value: (t.value === undefined || t.value === null) ? 0 : t.value };
  ["id","clause","quote","statement","logic","reviewer_note","effective_from","effective_to"].forEach(k => {
    out[k] = out[k] === null || out[k] === undefined ? "" : String(out[k]);
  });
  return out;
}

function emitDoc(doc){
  let s = "";
  s += "client: " + emitScalar(doc.client || "", 0) + "\n";
  s += "msa_ref: " + emitScalar(doc.msa_ref || "", 0) + "\n";
  if (doc.rate_card) s += "rate_card: " + emitScalar(doc.rate_card, 0) + "\n";
  if (doc.effective_from) s += "effective_from: " + emitScalar(doc.effective_from, 0) + "\n";
  if (doc.reviewed_by) s += "reviewed_by: " + emitScalar(doc.reviewed_by, 0) + "\n";
  if (doc.review_date) s += "review_date: " + emitScalar(doc.review_date, 0) + "\n";
  s += "rules:\n";
  (doc.rules || []).forEach(r => {
    s += "  - id: " + emitScalar(r.id, 4) + "\n";
    const f = (k, v, ind) => { const e = emitScalar(v, ind); return e === "" ? "" : "    " + k + ": " + e + "\n"; };
    s += f("clause", r.clause, 4);
    s += f("quote", r.quote, 4);
    s += f("statement", r.statement, 4);
    s += f("applies_to", r.applies_to, 4);
    s += emitMapField("scope", r.scope, 4);
    s += f("check", r.check, 4);
    if (r.check === "deterministic") s += f("logic", r.logic, 4);
    s += f("precedence_layer", r.precedence_layer, 4);
    s += emitList("requires_external", r.requires_external, 4);
    s += "    tolerance:\n      type: " + emitScalar(r.tolerance.type, 6) +
         "\n      value: " + (typeof r.tolerance.value === "number" ? r.tolerance.value : emitScalar(r.tolerance.value, 6)) + "\n";
    s += f("severity", r.severity, 4);
    s += f("effective_from", r.effective_from, 4);
    s += f("effective_to", r.effective_to, 4);
    s += f("confidence", r.confidence, 4);
    s += f("reviewer_note", r.reviewer_note, 4);
    s += "\n";
  });
  return s.replace(/\n{3,}$/,"\n");
}

/* =========================================================
   3. Validation
   ========================================================= */

function validateRule(r, all){
  const errs = [], warns = [];
  if (!r.id.trim()) errs.push("Rule id is missing.");
  else if (all.filter(x => x.id.trim() === r.id.trim()).length > 1) errs.push("Rule id is used more than once.");
  if (!r.clause.trim()) errs.push("Clause reference is missing. Every rule must cite the clause it comes from.");
  if (!r.statement.trim()) errs.push("Statement is missing.");
  if (!ENUMS.severity.includes(r.severity)) errs.push("Severity is not one of blocker, flag or info.");
  if (!ENUMS.check.includes(r.check)) errs.push("Check type is not one of deterministic or judgement.");

  if (!r.quote.trim()) warns.push("No verbatim quote. A reviewer cannot confirm this rule against the contract.");
  else if (r.quote.trim().split(/\s+/).length > 25) warns.push("Quote is longer than 25 words. Trim it to the phrase the rule rests on.");
  if (r.check === "deterministic" && !r.logic.trim()) warns.push("Marked deterministic but has no logic expression.");
  if (r.check === "judgement" && r.logic.trim()) warns.push("Marked judgement but carries a logic expression. Consider whether it is deterministic.");
  if (r.confidence !== "high" && !r.reviewer_note.trim()) warns.push("Confidence is " + r.confidence + " but there is no reviewer note saying what must be confirmed.");
  if (!r.effective_from.trim()) warns.push("No effective from date. The checker cannot tell which rate card period this applies to.");
  if (r.effective_from && !/^\d{4}-\d{2}-\d{2}$/.test(r.effective_from.trim())) warns.push("Effective from is not an ISO date (YYYY-MM-DD).");
  if (r.effective_to && !/^\d{4}-\d{2}-\d{2}$/.test(r.effective_to.trim())) warns.push("Effective to is not an ISO date (YYYY-MM-DD).");
  if (r.tolerance.type !== "none" && (r.tolerance.value === "" || r.tolerance.value === null)) warns.push("Tolerance type is set but no value is given.");
  if (r.requires_external.length && r.check === "judgement") warns.push("External data is listed on a judgement rule. Confirm the checker can reach it.");
  return { errs, warns };
}

function ruleNeedsReview(r, all){
  const v = validateRule(r, all);
  return v.errs.length > 0 || v.warns.length > 0 || r.confidence !== "high";
}

   4. State
   ========================================================= */

let doc = { client:"", msa_ref:"", rate_card:"", effective_from:"", reviewed_by:"", review_date:"", rules:[] };
let selected = -1;
let fileName = "rules.yaml";
let filters = { q:"", severity:"", confidence:"", check:"" };

const $ = id => document.getElementById(id);
const esc = s => String(s === null || s === undefined ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function toast(msg, isErr){
  const t = document.createElement("div");
  t.className = "toast" + (isErr ? " err" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), isErr ? 6000 : 2600);
}

/* =========================================================
   5. Rendering
   ========================================================= */

function renderMeta(){
  const fields = [
    ["client","Client"],["msa_ref","MSA reference"],["rate_card","Rate card in scope"],
    ["effective_from","Rules effective from"],["reviewed_by","Commercial owner"],["review_date","Next review date"]
  ];
  $("docmeta").innerHTML = fields.map(([k,label]) =>
    '<div class="field"><label for="m_'+k+'">'+label+'</label>' +
    '<input id="m_'+k+'" value="'+esc(doc[k]||"")+'" data-meta="'+k+'"' +
    (k.includes("date")||k==="effective_from" ? ' placeholder="YYYY-MM-DD"' : '') + '></div>'
  ).join("");
  $("docmeta").querySelectorAll("input[data-meta]").forEach(inp => {
    inp.addEventListener("input", e => { doc[e.target.dataset.meta] = e.target.value; renderCoverage(); });
  });
}

function renderCoverage(){
  const rules = doc.rules;
  const n = rules.length;
  const counts = { high:0, medium:0, low:0 };
  let errCount = 0;
  rules.forEach(r => {
    counts[ENUMS.confidence.includes(r.confidence) ? r.confidence : "low"]++;
    if (validateRule(r, rules).errs.length) errCount++;
  });
  const review = rules.filter(r => ruleNeedsReview(r, rules)).length;

  if (!n){
    $("bar").innerHTML = "";
    $("legend").innerHTML = '<span>No rules loaded. Open a YAML file produced by the extraction prompt, or start an empty set.</span>';
    return;
  }
  const seg = (c, k) => c ? '<span style="width:'+(c/n*100)+'%;background:var(--'+k+')" title="'+k+'"></span>' : "";
  $("bar").innerHTML = seg(counts.high,"high") + seg(counts.medium,"medium") + seg(counts.low,"low");
  $("legend").innerHTML =
    '<span><b>'+n+'</b> rules</span>' +
    '<span><span class="swatch" style="background:var(--high)"></span><b>'+counts.high+'</b> high confidence</span>' +
    '<span><span class="swatch" style="background:var(--medium)"></span><b>'+counts.medium+'</b> medium</span>' +
    '<span><span class="swatch" style="background:var(--low)"></span><b>'+counts.low+'</b> low</span>' +
    '<span><b>'+review+'</b> need review</span>' +
    (errCount ? '<span class="issuedot"><b>'+errCount+'</b> with blocking problems</span>' : '');
}

function passesFilter(r){
  if (filters.severity && r.severity !== filters.severity) return false;
  if (filters.confidence && r.confidence !== filters.confidence) return false;
  if (filters.check && r.check !== filters.check) return false;
  if (filters.q){
    const hay = (r.id+" "+r.clause+" "+r.statement+" "+r.quote+" "+r.reviewer_note).toLowerCase();
    if (!hay.includes(filters.q.toLowerCase())) return false;
  }
  return true;
}

function renderList(){
  const all = doc.rules;
  const idx = all.map((r,i) => i).filter(i => passesFilter(all[i]));
  const needs = idx.filter(i => ruleNeedsReview(all[i], all));
  const clear = idx.filter(i => !ruleNeedsReview(all[i], all));

  const row = i => {
    const r = all[i];
    const v = validateRule(r, all);
    const conf = ENUMS.confidence.includes(r.confidence) ? r.confidence : "low";
    return '<button class="rowitem'+(i===selected?" selected":"")+'" data-i="'+i+'">' +
      '<span class="rid"><span style="display:flex;align-items:center;gap:7px;min-width:0">' +
        '<span class="sev '+esc(r.severity)+'"></span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.id||"untitled rule")+'</span>' +
      '</span>' +
      '<span style="flex:none">'+(v.errs.length?'<span class="issuedot">!</span> ':'')+
        '<span class="conf '+conf+'">'+conf+'</span></span></span>' +
      '<span class="rstmt">'+esc(r.statement||"No statement yet.")+'</span>' +
      '</button>';
  };

  let html = "";
  if (!all.length){
    html = '<p style="padding:18px 12px;color:var(--muted)">Nothing here yet. Add a rule or open a file.</p>';
  } else if (!idx.length){
    html = '<p style="padding:18px 12px;color:var(--muted)">No rules match these filters.</p>';
  } else {
    if (needs.length) html += '<div class="groupname"><b>'+needs.length+'</b> need review</div>' + needs.map(row).join("");
    if (clear.length) html += '<div class="groupname"><b>'+clear.length+'</b> cleared</div>' + clear.map(row).join("");
  }
  $("list").innerHTML = html;
  $("list").querySelectorAll(".rowitem").forEach(b => {
    b.addEventListener("click", () => { selected = +b.dataset.i; renderList(); renderEditor(); });
  });
}

function sel(name, value, options){
  return '<select data-f="'+name+'">' + options.map(o =>
    '<option value="'+esc(o)+'"'+(o===value?" selected":"")+'>'+esc(o.replace(/_/g," "))+'</option>'
  ).join("") + '</select>';
}

function renderEditor(){
  const box = $("editor");
  if (selected < 0 || selected >= doc.rules.length){
    box.innerHTML = '<p class="empty">Pick a rule from the ledger to review it. Rules are grouped so that anything with a gap, a conflict or less than full confidence sits at the top.</p>';
    return;
  }
  const r = doc.rules[selected];
  const v = validateRule(r, doc.rules);
  const wc = r.quote.trim() ? r.quote.trim().split(/\s+/).length : 0;

  let issues = "";
  if (v.errs.length || v.warns.length){
    issues = '<div class="issues"><h3>'+(v.errs.length ? "This rule cannot ship yet" : "Worth checking before this ships")+'</h3><ul>' +
      v.errs.map(e => '<li class="err">'+esc(e)+'</li>').join("") +
      v.warns.map(w => '<li>'+esc(w)+'</li>').join("") + '</ul></div>';
  }

  const scopeRows = Object.keys(r.scope).map((k,i) =>
    '<div class="kv"><input value="'+esc(k)+'" data-scopekey="'+i+'" placeholder="field, e.g. role_grade">' +
    '<input value="'+esc(r.scope[k])+'" data-scopeval="'+i+'" placeholder="value, e.g. director_plus">' +
    '<button class="btn quiet danger" data-scopedel="'+i+'">Remove</button></div>'
  ).join("");

  box.innerHTML =
    '<div class="editorhead"><span class="who">Rule '+(selected+1)+' of '+doc.rules.length+'</span>' +
      '<span><button class="btn quiet" id="btnDup">Duplicate</button> ' +
      '<button class="btn quiet danger" id="btnDel">Delete rule</button></span></div>' +
    issues +
    '<div class="quoteblock">' +
      '<textarea rows="2" data-f="quote" placeholder="Paste the verbatim contract wording this rule rests on">'+esc(r.quote)+'</textarea>' +
      '<div class="quotemeta">'+(wc ? wc+' words'+(wc>25?', over the 25 word limit':'') : 'No quote yet')+
        (r.clause ? ' from '+esc(r.clause) : '')+'</div>' +
    '</div>' +

    '<div class="stack">' +
      '<div class="grid2">' +
        '<div class="field"><label>Rule id</label><input class="mono" data-f="id" value="'+esc(r.id)+'" placeholder="CLIENT-RATE-01"></div>' +
        '<div class="field"><label>Clause reference, exactly as printed</label><input data-f="clause" value="'+esc(r.clause)+'" placeholder="Sch 2, 4.3"></div>' +
      '</div>' +
      '<div class="field"><label>Statement, testable and without hedging</label>' +
        '<textarea rows="3" data-f="statement" placeholder="Annual uplift is capped at CPI or 3 per cent, whichever is lower.">'+esc(r.statement)+'</textarea></div>' +
    '</div>' +

    '<hr class="sectionrule"><p class="sectionname">How the checker runs it</p>' +
    '<div class="grid3">' +
      '<div class="field"><label>Applies to</label>'+sel("applies_to", r.applies_to, ENUMS.applies_to)+'</div>' +
      '<div class="field"><label>Check type</label>'+sel("check", r.check, ENUMS.check)+'</div>' +
      '<div class="field"><label>Severity</label>'+sel("severity", r.severity, ENUMS.severity)+'</div>' +
    '</div>' +
    (r.check === "deterministic"
      ? '<div class="field" style="margin-top:14px"><label>Logic expression</label>' +
        '<textarea class="mono" rows="2" data-f="logic" placeholder="uplift_pct &lt;= min(cpi_pct, 3)">'+esc(r.logic)+'</textarea></div>'
      : '<p style="color:var(--muted);margin:14px 0 0">Judgement rules carry no logic. The checker sends this statement to a model and returns a flag for a human, never a pass or fail on its own.</p>') +

    '<div class="grid2" style="margin-top:14px">' +
      '<div class="field"><label>Tolerance type</label>'+sel("tolerance_type", r.tolerance.type, ENUMS.tolerance_type)+'</div>' +
      '<div class="field"><label>Tolerance value</label><input type="number" step="any" data-f="tolerance_value" value="'+esc(r.tolerance.value)+'"'+(r.tolerance.type==="none"?" disabled":"")+'></div>' +
    '</div>' +

    '<div class="field" style="margin-top:14px"><label>Scope filters, applied before the rule runs</label>' +
      (scopeRows || '<p style="color:var(--faint);margin:0 0 8px">No filters. This rule runs against every '+esc(r.applies_to.replace(/_/g," "))+'.</p>') +
      '<button class="btn quiet" id="btnScopeAdd">Add filter</button></div>' +

    '<div class="field" style="margin-top:14px"><label>Data the checker must fetch from outside the budget, one per line</label>' +
      '<textarea rows="3" class="mono" data-f="requires_external" placeholder="prior_year_approved_rate">'+esc(r.requires_external.join("\n"))+'</textarea></div>' +

    '<hr class="sectionrule"><p class="sectionname">Provenance and review</p>' +
    '<div class="grid3">' +
      '<div class="field"><label>Precedence layer</label>'+sel("precedence_layer", r.precedence_layer, ENUMS.precedence_layer)+'</div>' +
      '<div class="field"><label>Effective from</label><input data-f="effective_from" value="'+esc(r.effective_from)+'" placeholder="YYYY-MM-DD"></div>' +
      '<div class="field"><label>Effective to</label><input data-f="effective_to" value="'+esc(r.effective_to)+'" placeholder="YYYY-MM-DD"></div>' +
    '</div>' +
    '<div class="grid2" style="margin-top:14px">' +
      '<div class="field"><label>Confidence</label>'+sel("confidence", r.confidence, ENUMS.confidence)+'</div>' +
      '<div class="field"><label>Set high only once a person has confirmed the reading</label>' +
        '<p style="color:var(--muted);margin:6px 0 0;font-size:12.5px">Anything below high stays in the review group and should not be relied on by the checker.</p></div>' +
    '</div>' +
    '<div class="field" style="margin-top:14px"><label>Reviewer note, what must be confirmed and by whom</label>' +
      '<textarea rows="3" data-f="reviewer_note">'+esc(r.reviewer_note)+'</textarea></div>';

  bindEditor(r);
}

function bindEditor(r){
  const box = $("editor");
  box.querySelectorAll("[data-f]").forEach(el => {
    const ev = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(ev, e => {
      const f = e.target.dataset.f;
      const val = e.target.value;
      if (f === "tolerance_type"){
        r.tolerance.type = val;
        if (val === "none") r.tolerance.value = 0;
        renderEditor();
      } else if (f === "tolerance_value"){
        r.tolerance.value = val === "" ? 0 : Number(val);
      } else if (f === "requires_external"){
        r.requires_external = val.split("\n").map(s => s.trim()).filter(Boolean);
      } else if (f === "check"){
        r.check = val; renderEditor();
      } else {
        r[f] = val;
      }
      renderList(); renderCoverage();
      if (f === "quote" || f === "clause" || f === "confidence" || f === "severity"){
        const meta = box.querySelector(".quotemeta");
        if (meta){
          const wc = r.quote.trim() ? r.quote.trim().split(/\s+/).length : 0;
          meta.textContent = (wc ? wc + " words" + (wc > 25 ? ", over the 25 word limit" : "") : "No quote yet") +
            (r.clause ? " from " + r.clause : "");
        }
      }
    });
  });

  box.querySelectorAll("[data-scopekey]").forEach(el => el.addEventListener("change", e => {
    const i = +e.target.dataset.scopekey;
    const keys = Object.keys(r.scope);
    const old = keys[i];
    const next = {};
    keys.forEach(k => { next[k === old ? e.target.value : k] = r.scope[k]; });
    r.scope = next; renderEditor();
  }));
  box.querySelectorAll("[data-scopeval]").forEach(el => el.addEventListener("input", e => {
    const k = Object.keys(r.scope)[+e.target.dataset.scopeval];
    r.scope[k] = e.target.value;
  }));
  box.querySelectorAll("[data-scopedel]").forEach(el => el.addEventListener("click", e => {
    delete r.scope[Object.keys(r.scope)[+e.target.dataset.scopedel]];
    renderEditor();
  }));
  const add = $("btnScopeAdd");
  if (add) add.addEventListener("click", () => {
    let k = "field", n = 1;
    while (k in r.scope) k = "field" + (++n);
    r.scope[k] = "";
    renderEditor();
  });

  $("btnDup").addEventListener("click", () => {
    const copy = normaliseRule(JSON.parse(JSON.stringify(r)));
    copy.id = nextId(r.id);
    copy.confidence = "low";
    copy.reviewer_note = (copy.reviewer_note ? copy.reviewer_note + " " : "") + "Copied from " + r.id + ". Confirm the clause reference and quote.";
    doc.rules.splice(selected + 1, 0, copy);
    selected += 1;
    renderAll();
  });
  $("btnDel").addEventListener("click", () => {
    if (!confirm("Delete " + (r.id || "this rule") + "? This cannot be undone unless you have saved a copy.")) return;
    doc.rules.splice(selected, 1);
    selected = Math.min(selected, doc.rules.length - 1);
    renderAll();
  });
}

function nextId(id){
  const m = String(id).match(/^(.*?)(\d+)$/);
  if (!m) return id + "-COPY";
  const width = m[2].length;
  let n = parseInt(m[2], 10);
  let candidate;
  do { n++; candidate = m[1] + String(n).padStart(width, "0"); }
  while (doc.rules.some(r => r.id === candidate));
  return candidate;
}

function renderAll(){
  renderMeta(); renderCoverage(); renderList(); renderEditor();
  if (!$("viewRaw").hidden) $("rawText").value = emitDoc(doc);
}

/* =========================================================
   6. File handling
   ========================================================= */

function loadFromText(text, name){
  let parsed;
  try { parsed = yamlParse(text); }
  catch (e){ toast("Could not read that YAML. " + e.message, true); return false; }

  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)){
    toast("That file does not look like a rule set. Expected a document with a rules list.", true);
    return false;
  }
  if (!Array.isArray(parsed.rules)){
    toast("No rules list found in that file. Check the top level key is called rules.", true);
    return false;
  }
  doc = {
    client: parsed.client || "", msa_ref: parsed.msa_ref || "",
    rate_card: parsed.rate_card || "", effective_from: parsed.effective_from || "",
    reviewed_by: parsed.reviewed_by || "", review_date: parsed.review_date || "",
    rules: parsed.rules.map(normaliseRule)
  };
  selected = doc.rules.length ? 0 : -1;
  if (name){ fileName = name; $("filename").textContent = name; }
  renderAll();
  toast("Loaded " + doc.rules.length + " rules.");
  return true;
}

function saveFile(){
  const yaml = emitDoc(doc);
  const base = (doc.client || "rules").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const stamp = new Date().toISOString().slice(0,10);
  const name = base + "-msa-rules-" + stamp + ".yaml";
  const blob = new Blob([yaml], { type:"text/yaml;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  fileName = name; $("filename").textContent = name;
  toast("Saved " + name);
}

$("btnCopy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(emitDoc(doc)); toast("YAML copied."); }
  catch { toast("Clipboard is blocked here. Use the YAML tab and copy from there.", true); }
});
$("btnAdd").addEventListener("click", () => {
  const r = blankRule();
  const prefix = (doc.client || "RULE").toUpperCase().replace(/[^A-Z0-9]+/g,"").slice(0,6) || "RULE";
  let n = doc.rules.length + 1, id;
  do { id = prefix + "-OTHER-" + String(n++).padStart(2,"0"); } while (doc.rules.some(x => x.id === id));
  r.id = id;
  r.reviewer_note = "Added by hand. Cite the clause and paste the verbatim wording before this is relied on.";
  doc.rules.push(r);
  selected = doc.rules.length - 1;
  renderAll();
});

["severity","confidence","check"].forEach(k => {
  const el = $("f" + k[0].toUpperCase() + k.slice(1));
  ENUMS[k].forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v.replace(/_/g," ");
    el.appendChild(o);
  });
  el.addEventListener("change", e => { filters[k] = e.target.value; renderList(); });
});
$("q").addEventListener("input", e => { filters.q = e.target.value; renderList(); });

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  const raw = t.dataset.view === "raw";
  $("viewRaw").hidden = !raw;
  $("viewRules").hidden = raw;
  if (raw) $("rawText").value = emitDoc(doc);
}));
$("btnApplyRaw").addEventListener("click", () => {
  if (loadFromText($("rawText").value, fileName)){
    document.querySelector('.tab[data-view="rules"]').click();
  }
});
$("btnRefreshRaw").addEventListener("click", () => { $("rawText").value = emitDoc(doc); });

let dragDepth = 0, veil = null;
window.addEventListener("dragenter", e => {
  e.preventDefault(); dragDepth++;
  if (!veil){
    veil = document.createElement("div");
    veil.className = "dropveil";
    veil.textContent = "Drop a rule set to open it";
    document.body.appendChild(veil);
  }
});
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("dragleave", () => { if (--dragDepth <= 0 && veil){ veil.remove(); veil = null; dragDepth = 0; } });
window.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0;
  if (veil){ veil.remove(); veil = null; }
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => loadFromText(rd.result, f.name);
  rd.readAsText(f);
});

window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); saveFile(); }
});
window.addEventListener("beforeunload", e => {
  if (doc.rules.length){ e.preventDefault(); e.returnValue = ""; }
});

renderAll();
</script>
</body>
</html>
